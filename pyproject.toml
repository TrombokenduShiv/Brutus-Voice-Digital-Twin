[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brutus-voice-twin"
version = "0.3.0"
description = "Provider-agnostic HDVR voice digital twin service for BRUTUS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "PyYAML>=6.0",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jiwer>=3.0",
  "cryptography>=43",
  "google-genai>=2.25.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.48",
  "speechbrain>=1.0",
  "scikit-learn>=1.5",
  "phonemizer>=3.3",
  "tensorboard>=2.18",
  "safetensors>=0.4",
]
qwen = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.48",
  "qwen-tts",
]
testml = [
  "torch>=2.4",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["voice_twin*", "training*", "evaluation*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
