[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brutus-voice-twin"
version = "0.1.0"
description = "HDVR high-fidelity voice digital twin service for BRUTUS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "PyYAML>=6.0",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.48",
  "speechbrain>=1.0",
  "jiwer>=3.0",
  "scikit-learn>=1.5",
  "cryptography>=43",
]

[project.optional-dependencies]
qwen = ["qwen-tts"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["voice_twin*", "training*", "evaluation*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
